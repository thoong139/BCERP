[project]
name = "mcv3-integration-tests"
version = "1.0.0"
description = "Phase 5 integration tests cho MCV3 DEVKIT — 8 scenarios (A-H)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["scenarios"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
markers = [
  "slow: test chay lau (> 1s)",
  "integration: integration test can setup fixture",
  "smoke: smoke test nhanh cho CI pre-merge",
  "scenario_a: new project full path",
  "scenario_b: legacy project full path",
  "scenario_c: feature addition",
  "scenario_d: resume mid-phase",
  "scenario_e: workload gate + CDG + anti-loop",
  "scenario_f: api-only conditional skip",
  "scenario_g: session cleanup",
  "scenario_h: concurrent lane write",
]

[tool.coverage.run]
source = ["validators", "fixtures"]
branch = true
omit = ["*/__pycache__/*", "*/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
